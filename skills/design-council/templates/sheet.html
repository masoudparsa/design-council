<!doctype html>
<!-- Design Council contact sheet: one screenshot = mobile default + riskiest state + desktop/tablet.
     Params: src (absolute file URL of the concept), state, desktop=1 | tablet=1, label, theme=dark -->
<html lang="en"><head><meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --bg:#eceef1; --fg:#1d2024; --frame:#c9cdd3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181b; --fg:#e7e9ec; --frame:#3a3f46; } }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 13px/1.3 system-ui, sans-serif; padding: 20px 24px; }
  h1 { font-size: 15px; margin-bottom: 12px; }
  .row { display: flex; gap: 24px; align-items: flex-start; }
  .cap { margin-bottom: 6px; opacity: .75; }
  .box { overflow: hidden; border: 1px solid var(--frame); border-radius: 10px; background: #fff; }
  iframe { border: 0; transform-origin: 0 0; display: block; }
</style></head>
<body>
<h1 id="t"></h1>
<div class="row" id="row"></div>
<script>
  const q = new URLSearchParams(location.search);
  const src = q.get('src');
  const state = q.get('state');
  const dark = q.get('theme') === 'dark' || matchMedia('(prefers-color-scheme: dark)').matches;
  document.getElementById('t').textContent = (q.get('label') || 'Concept') + (dark ? ' · dark' : '');
  const panels = [{ cap: 'Mobile 390 · default', w: 390, h: 844, s: .72, st: 'default' }];
  if (state && state !== 'default') panels.push({ cap: 'Mobile 390 · ' + state, w: 390, h: 844, s: .72, st: state });
  if (q.get('desktop') === '1') panels.push({ cap: 'Desktop 1440 · default', w: 1440, h: 900, s: .5, st: 'default' });
  else if (q.get('tablet') === '1') panels.push({ cap: 'Tablet 834 · default', w: 834, h: 1112, s: .5, st: 'default' });
  const row = document.getElementById('row');
  for (const p of panels) {
    const url = src + (src.includes('?') ? '&' : '?') + 'state=' + encodeURIComponent(p.st) + (dark ? '&theme=dark' : '');
    const wrap = document.createElement('div');
    wrap.innerHTML = `<div class="cap">${p.cap}</div><div class="box" style="width:${p.w*p.s}px;height:${p.h*p.s}px"><iframe src="${url}" width="${p.w}" height="${p.h}" style="transform:scale(${p.s})"></iframe></div>`;
    row.appendChild(wrap);
  }
</script>
</body></html>
